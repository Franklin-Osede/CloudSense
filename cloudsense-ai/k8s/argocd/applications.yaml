apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudsense-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Franklin-Osede/CloudSense.git"
    targetRevision: HEAD
    path: cloudsense-ai/k8s/observability
  destination:
    server: "https://kubernetes.default.svc"
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudsense-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Franklin-Osede/CloudSense.git"
    targetRevision: HEAD
    path: cloudsense-ai/k8s/app
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cloudsense-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
